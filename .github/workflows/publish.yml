name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"   # triggers on tags like v0.2.1, v1.0.0, etc.

jobs:
  # ── 1. Run tests before publishing ────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        pip install pytest-cov

    - name: Run tests
      run: |
        pytest --cov=funstat_api --cov-branch --cov-report=xml

  # ── 2. Build and publish ───────────────────────────────────────────────────
  publish:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/funstat-api

    permissions:
      id-token: write   # required for trusted publishing (OIDC)

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip build

    - name: Build package
      run: python -m build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        # Option A: API token (classic) — add PYPI_API_TOKEN to GitHub Secrets
        password: ${{ secrets.PYPI_API_TOKEN }}
        # Option B: Trusted Publisher (OIDC) — remove the password line above
        # and configure PyPI Trusted Publisher instead (no token needed).
