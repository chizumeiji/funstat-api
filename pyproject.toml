[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "funstat-api"
version = "0.2.0"
description = "Sync and async Python client for the Funstat/Telelog API (Telegram user/group statistics)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "meiji", email = "chizumeiji@gmail.com" }
]
keywords = ["telegram", "funstat", "api", "client", "statistics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "pydantic>=2.0",
  "requests>=2.28",
  "httpx>=0.24",
]

[project.urls]
Homepage = "https://github.com/chizumeiji/funstat-api"
Documentation = "https://chizumeiji.github.io/funstat-api/"
"Bug Tracker" = "https://github.com/chizumeiji/funstat-api/issues"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21.0",
  "pytest-cov>=4.0",
  "respx>=0.20.2",
  "requests-mock>=1.11.0",
  "ruff>=0.3.0",
  "mypy>=1.5.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true